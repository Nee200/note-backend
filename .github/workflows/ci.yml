name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:8.2.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 4242
      LOCAL_DEV_SAFE_MODE: "true"
      MONGO_URI: mongodb://127.0.0.1:27017/note-localtest
      JWT_SECRET: synthetic-ci-secret-at-least-32-bytes
      ADMIN_PASSWORD: synthetic-ci-admin-password
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      FRONTEND_PUBLIC_URL: http://localhost:5500
      BACKEND_PUBLIC_URL: http://localhost:4242
      TRUSTED_BROWSER_ORIGINS: http://localhost:5500
      BACKEND_BASE_URL: http://localhost:4242
      SMOKE_TRUSTED_ORIGIN: http://localhost:5500

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run test:syntax

      - name: Dependency audit
        run: npm run test:audit

      - name: Unit and isolated integration tests
        run: npm test

      - name: Seed local MongoDB
        run: node scripts/seed-ci-products.js

      - name: Start backend in safe mode
        run: |
          nohup node server.js > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$BACKEND_BASE_URL/ready" >/dev/null; then
              exit 0
            fi
            echo "Waiting for backend readiness ($attempt/30)"
            sleep 2
          done
          cat backend-ci.log
          exit 1

      - name: Backend smoke test
        run: npm run smoke

      - name: Safe-mode checkout smoke test
        run: npm run smoke:checkout:safe

      - name: Backend logs on failure
        if: failure()
        run: cat backend-ci.log || true
