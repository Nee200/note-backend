name: Uptime Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/uptime-monitor.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check backend readiness endpoint
        env:
          BACKEND_READY_URL: ${{ vars.BACKEND_READY_URL }}
        run: |
          set -euo pipefail

          URL="${BACKEND_READY_URL:-https://note-backend-5gy0.onrender.com/ready}"
          echo "Checking backend: $URL"

          # Render free/low-traffic services can cold-start slowly. Keep trying long
          # enough to wake the instance instead of failing on the first timeout.
          for attempt in $(seq 1 12); do
            echo "Backend attempt $attempt/12"
            HTTP_CODE="$(
              curl -sS \
                --connect-timeout 15 \
                --max-time 60 \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                -o backend-health.json \
                -w "%{http_code}" \
                "$URL" || true
            )"
            echo "Backend HTTP status: ${HTTP_CODE:-curl_failed}"

            if [ "${HTTP_CODE:-000}" -ge 200 ] && [ "${HTTP_CODE:-000}" -lt 400 ]; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Backend did not become healthy in time."
              [ -f backend-health.json ] && cat backend-health.json || true
              exit 1
            fi

            sleep 10
          done

          if ! grep -q '"status":"ready"' backend-health.json; then
            echo "Backend readiness payload did not report status=ready"
            cat backend-health.json
            exit 1
          fi

      - name: Check frontend availability
        env:
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          URL="${FRONTEND_HEALTH_URL:-https://note-fragrances.de/}"
          echo "Checking frontend: $URL"

          HTTP_CODE="$(curl -sS --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code}" "$URL")"
          echo "Frontend HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 400
